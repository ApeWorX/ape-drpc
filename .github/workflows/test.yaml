on: ["push", "pull_request"]

name: Test

concurrency:
  # Cancel older, in-progress jobs from the same PR, same workflow.
  # use run_id if the job is triggered by a push to ensure
  # push-triggered jobs to not get canceled.
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
    linting:
        runs-on: ubuntu-latest

        steps:
        - uses: actions/checkout@v5

        - uses: astral-sh/setup-uv@v7
          with:
              python-version: "3.10"

        - name: Run Ruff Lint
          run: uv run --group lint ruff check .

        - name: Run Ruff Format
          run: uv run --group lint ruff format --check .

        - name: Run mdformat
          run: uv run --group lint mdformat --check *.md

    type-check:
        runs-on: ubuntu-latest

        steps:
        - uses: actions/checkout@v5

        - uses: astral-sh/setup-uv@v7
          with:
            # NOTE: Use minimum supported Python version to avoid using new syntax
            python-version: "3.10"

        - name: Run MyPy
          run: uv run --group lint --group test mypy .

    functional:
        runs-on: ${{ matrix.os }}

        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

        env:
          APE_DRPC_API_KEY: ${{ secrets.APE_DRPC_API_KEY }}
          GITHUB_ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        steps:
        - uses: actions/checkout@v5
          with:
            fetch-depth: 0

        - uses: astral-sh/setup-uv@v7
          with:
            python-version: ${{ matrix.python-version }}

        - name: Run Tests
          if: runner.os != 'Windows'
          run: uv run --group test ape test -m "not fuzzing" -s

        - name: Run Tests (Windows)
          # eth-ape pins numpy<2; 3.13/3.14 have no win wheel and crash on import.
          if: runner.os == 'Windows' && matrix.python-version != '3.13' && matrix.python-version != '3.14'
          run: uv run --group test ape test -m "not fuzzing" -s

        - name: Run Tests (Windows + numpy 2)
          if: runner.os == 'Windows' && (matrix.python-version == '3.13' || matrix.python-version == '3.14')
          run: uv run --group test --override numpy>=2.0 ape test -m "not fuzzing" -s
